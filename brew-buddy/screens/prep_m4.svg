<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%"><defs><clipPath id="c"><circle cx="120" cy="120" r="120"/></clipPath></defs><g clip-path="url(#c)"><rect width="240" height="240" fill="#000000"/><g transform="translate(109.00 19.00) scale(0.9167)" color="#9575CD" fill="none" stroke="#9575CD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M12 2.5v6.5"/><path d="M8 2.5h8"/><path d="M7 9h10v11H7z"/><path d="M10 20v2 M14 20v2"/></g><text x="120.0" y="83.5" dy=".35em" font-family="Poppins, system-ui, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Weigh 30g, grind 6.5.</text><text x="120.0" y="98.5" dy=".35em" font-family="Poppins, system-ui, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Heat water to 96C. Rinse</text><text x="120.0" y="113.5" dy=".35em" font-family="Poppins, system-ui, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">and fit the filter. Place</text><text x="120.0" y="128.5" dy=".35em" font-family="Poppins, system-ui, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">on cup, tare, press play.</text><rect x="65.0" y="181.0" width="38.0" height="38.0" rx="19.0" fill="#4A4A4A" opacity="1.0"/><g transform="translate(75.00 191.00) scale(0.7500)" color="#FFFFFF" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M15 5l-7 7 7 7"/></g><rect x="119.0" y="171.0" width="54.0" height="54.0" rx="27.0" fill="#43A047" opacity="1.0"/><g transform="translate(134.00 186.00) scale(1.0000)" color="#FFFFFF" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke-linejoin="round"/></g></g></svg>